table: network_geography_hierarchy
required: true
unique:
  - [geo_id]
description: >
  How the ISP's geographies nest inside one another.

  A REZ sits in an ISP sub-region, a sub-region in a NEM region, and every NEM
  region in the NEM. Each row names one geography and, in a column per level,
  the sub-region, NEM region and NEM it is or sits inside. The table holds
  the hierarchy down to sub-regions and REZs whatever regional granularity the
  model is built at: `network_geography` says which of these geographies the
  model is built from.

  When the template is filtered to some regions (the config's
  filter_by_nem_regions or filter_by_isp_sub_regions), the table holds only
  the selected sub-regions, the REZs inside them, and the NEM regions and NEM
  that contain them. Every sub-region in the table has its demand placed in
  the model, so a sub-region outside the selection must not have a row.

  The table has no column for the type of geography, because the level columns
  already say it: a sub-region is a row whose geo_id equals its subregion_id, a
  NEM region one whose geo_id equals its region_id, and the NEM the row whose
  geo_id equals its nem_id. A REZ is a row whose geo_id equals none of the
  three.

  Tasmania is a NEM region with a single sub-region, and the two share the id
  TAS. It has one row, with TAS as both its subregion_id and its region_id, so
  it is both a sub-region and a NEM region.

  The translator uses the hierarchy to take data given at one level and place
  it at the level the model is built at. For example, demand traces are
  published per ISP sub-region, and each sub-region's demand is placed at the
  `network_geography` geography that is the sub-region itself or contains it.

  Source tables:
    - `sub_regional_reference_nodes`
    - `renewable_energy_zones`
custom_validation:
  - name: rez_region_matches_its_subregion
    description: >
      A row's region_id must equal the region_id of the row for its
      subregion_id. For example, the REZ N3 with subregion_id CNSW and
      region_id QLD is invalid when the CNSW row has region_id NSW.
  - name: model_geographies_are_in_the_hierarchy
    description: >
      Every geo_id in `network_geography` must have a row in this table.
  - name: each_geography_has_one_model_geography_above_rez_level
    description: >
      `network_geography` must not hold both a sub-region, NEM region or the
      NEM and another of those that contains it. For example, holding both
      CNSW and NSW is invalid: data given for CNSW could be placed at either.
      A REZ and the sub-region it sits inside may both be present.
columns:
  geo_id:
    type: string
    required: true
    description: Unique identifier for the geography, e.g. CNSW.
  subregion_id:
    type: string
    required: false
    allowed_values_from:
      - network_geography_hierarchy: geo_id
    description: >
      The ISP sub-region the geography is or sits inside. For a sub-region,
      equals geo_id.

      If empty:
      The geography is a NEM region or the NEM, which sit inside no
      sub-region.
  region_id:
    type: string
    required: false
    allowed_values_from:
      - network_geography_hierarchy: geo_id
    description: >
      The NEM region the geography is or sits inside. For a NEM region, equals
      geo_id. The region_id TAS refers to the one TAS row, which is both a
      sub-region and a NEM region.

      If empty:
      The geography is the NEM, which sits inside no NEM region.
  nem_id:
    type: string
    required: true
    allowed_values: [NEM]
    description: >
      The NEM, which every geography is or sits inside. "NEM" on every row.
