table: custom_constraints_lhs
required: false
unique:
  - [constraint_id, term_type, variable_name, date_from]
description: >
  Left-hand-side terms of the custom constraints: one row per (constraint,
  model variable) coefficient.

  Source tables:
    - PLEXOS model extract (`lhs_terms.csv`), via the custom-constraints
      templater.

  Source notes:
  variable_name uses IASR IDs for generators and batteries, path_ids for links
  and sub-region codes for loads. The variable_names_resolve_by_term_type rule
  checks each name against the input table for its term_type; the translator
  separately raises on any term whose component the configured model doesn't
  build (e.g. a link_flow term on a REZ connection path when REZs are attached
  to their parent nodes).

  If absent:
  Constraints have no terms, so no custom constraints bind.
custom_validation:
  - name: lhs_and_rhs_name_the_same_constraints
    description: >
      Every constraint_id with a row here must have at least one row in
      custom_constraints_rhs, and every constraint_id in custom_constraints_rhs
      must have at least one row here. A constraint with terms but no limit
      value, or a limit value but no terms, cannot be applied. This does not
      require every custom_constraints row to have terms: a catalogued
      constraint with neither LHS nor RHS rows simply never binds.
  - name: variable_names_resolve_by_term_type
    description: >
      Each row's variable_name must exist in the table its term_type refers to:
      link_flow -> network_transmission_paths.path_id; generator_output and
      generator_capacity -> generators_existing_planned.name or
      generators_new_entrant.name; storage_output -> storage_existing_planned.name
      or storage_new_entrant.name; load -> network_geography.geo_id. A term
      naming a component that is not in those tables cannot be applied.
columns:
  constraint_id:
    type: string
    required: true
    allowed_values_from:
      - custom_constraints: constraint_id
    description: Constraint the term belongs to.
  term_type:
    type: string
    required: true
    allowed_values: [generator_output, generator_capacity, storage_output, link_flow, load]
    description: >
      Model variable type the term applies to: a generator's dispatch, a
      generator's installed capacity, a battery's net dispatch (discharging
      minus charging), a transmission path's flow, or a node's load
      consumption. A load term is data rather than a variable: the demand at
      the node, scaled by the coefficient.
  variable_name:
    type: string
    required: true
    description: >
      Name of the model element the term's variable belongs to: an IASR ID for
      generator_output, generator_capacity and storage_output terms, a path_id
      for link_flow terms, a sub-region geo_id for load terms (see
      custom_validation for the table each resolves against).

      Names refer to whole elements, never to the per-build-year components
      the translator builds from them, and one term covers every component of
      its element. A new entrant generator or storage unit is referred to by
      its name in generators_new_entrant / storage_new_entrant (its location
      and technology, e.g. "N2 Solar"), and the term applies to the unit in
      every build year. A path is referred to by its path_id (e.g. "NSW-QLD"),
      and the term applies to the path's existing link and each of its
      expansion links.
  coefficient:
    type: float
    required: true
    description: Coefficient the variable is multiplied by in the constraint.
  date_from:
    type: date
    required: false
    format: "%Y-%m-%dT%H:%M:%S"
    description: >
      Date this row's coefficient takes effect. For each investment period,
      the coefficient active at the period's start applies for the whole
      period. A period starts on 1 July of the preceding year when year_type
      is fy, and on 1 January otherwise.

      Rows supersede each other only within the same constraint_id,
      term_type, and variable_name group. A dated coefficient has no end
      date: it holds until a later row in its group supersedes it, so
      reverting to an earlier coefficient, or removing the term
      (coefficient 0), needs its own dated row. A group with no undated row contributes no term to periods
      starting before its earliest date_from.

      If absent (or empty):
      The coefficient applies from the start of the model horizon (until
      another row's date_from supersedes it).
