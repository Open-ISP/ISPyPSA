table: network_transmission_paths
required: false
unique:
  - [path_id]
description: >
  Transmission paths connecting geographies in the network model.

  Includes inter-subregional flow paths, regional interconnectors, and
  REZ-to-subregion connections.

  Source tables:
    - `flow_path_transfer_capability`
    - `renewable_energy_zones`
    - `flow_path_augmentation_options_<flow_path>`
    - `inter_regional_loss_equations_existing`

  Source notes:
  Where augmentation options exist for a corridor with no existing path (a new
  parallel corridor), the `templater` appends a zero-capacity base path so the
  expansion option has a physical path to expand.

  If absent:
  The model is constructed with no transmission paths. Geographies with no
  connecting paths are electrically isolated.
columns:
  path_id:
    type: string
    required: true
    description: >
      Unique identifier for the path. Base format is geo_from-geo_to (e.g.
      CQ-NQ). Parallel paths append a suffix after an underscore (e.g.
      NNSW-SQ_Terranora, CNSW-SNW_NTH). The geo codes used vary with
      regional_granularity: ISP sub-region codes for "sub_regions", NEM region
      codes for "nem_regions", and "NEM" for "single_region" (REZ paths only).
  geo_from:
    type: string
    required: true
    allowed_values_from:
      - network_geography: geo_id
    description: Origin geography. Defines the forward flow direction.
  geo_to:
    type: string
    required: true
    allowed_values_from:
      - network_geography: geo_id
    description: Destination geography. Defines the forward flow direction.
  carrier:
    type: string
    required: true
    allowed_values: [AC, DC]
    description: Transmission technology.
  loss_group:
    type: string
    required: false
    allowed_values_from:
      - network_transmission_losses: loss_group
    description: >
      Loss group the path belongs to: the set of paths whose combined flow one
      loss curve in network_transmission_losses is applied to. In templated
      tables a flow path is in the group named for it, or for its corridor
      where the IASR gives one curve for parallel paths (CNSW-SNW_NTH and
      CNSW-SNW_STH are both in CNSW-SNW). Paths in a group must share their
      geo_from and geo_to.

      If absent (or empty):
      No losses are modelled on the path. Templated REZ connection paths have
      no loss group.
