  where: {IASR ID / DLT names: [CSPVPS1, DAYDSF1]}
  replace: {CQ: NQ}
  reason: Mis-labelled subregion for existing units in Q10 REZ.

- table: existing_committed_anticipated_additional_generator_summary
  column: Sub-region
  where: {IASR ID / DLT names: [EMERASF1]}
  replace: {NQ: CQ}
  reason: Mis-labelled subregion for existing unit in Q4 REZ.

- table: existing_committed_anticipated_additional_generator_summary
  column: Sub-region
  where: {IASR ID / DLT names: [WPWF]}
  replace: {NSA: CSA}
  reason: Mis-labelled subregion for existing unit in S4 REZ.

- table: existing_committed_anticipated_additional_generator_summary
  column: REZ ID
  where: {IASR ID / DLT names: [Eraring Big Battery]}
